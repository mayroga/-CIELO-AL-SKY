databases:
  - name: cuba-directo-db
    databaseName: cuba_directo
    user: cuba_directo_user
    plan: basic-256mb

services:
  - type: web
    name: cuba-directo
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    disk:
      name: cuba-directo-images
      mountPath: /var/data
      sizeGB: 10

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cuba-directo-db
          property: connectionString

      - key: ADMIN_ACCESS_CODE
        generateValue: true

      - key: ADMIN_API_TOKEN
        generateValue: true

      - key: IMAGE_STORAGE_PATH
        value: /var/data

      - key: PYTHON_VERSION
        value: 3.12.8
